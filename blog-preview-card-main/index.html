<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- exibe o site corretamente conforme o dispositivo do usuário -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Cartão de prévia de blog</title>
  <link rel="stylesheet" href="./style.css">

  <!-- Fique à vontade para remover estes estilos ou personalizar no seu próprio arquivo CSS 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <div class="card__image">
        <img src="./assets/images/illustration-article.svg" alt="Ilustração abstrata com formas geométricas pretas e brancas sobre fundo amarelo">
      </div>

      <div class="card__content">
        <span class="card__tag">Aprendizado</span>
        <p class="card__date">Publicado em 21 dez 2023</p>

        <h1 class="card__title">
          <a href="#">Fundamentos de HTML e CSS</a>
        </h1>
        <p class="card__description">Essas linguagens são a base de todo site, definindo estrutura, conteúdo e apresentação.</p>

        <div class="card__author">
          <img src="./assets/images/image-avatar.webp" alt="">
          <p class="card__author-name">Greg Hooper</p>
        </div>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Desafio do <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Codificado por <a href="#">Victor Freitas</a>.
  </footer>
</body>
</html>
